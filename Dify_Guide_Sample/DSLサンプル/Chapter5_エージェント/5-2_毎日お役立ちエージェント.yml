app:
  description: ''
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: agent-chat
  name: 5-2_毎日お役立ちエージェント
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/google:0.0.8@3efcf55ffeef9d0f77715e0afb23534952ae0cb385c051d0637e86d71199d1a6
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:0.0.7@11ec0b1909200f62b6ebf2cec1da981a9071d11c1ee0e2ef332ce89bcffa2544
kind: app
model_config:
  agent_mode:
    enabled: true
    max_iteration: 5
    prompt: null
    strategy: function_call
    tools:
    - enabled: true
      notAuthor: true
      provider_id: langgenius/google/google
      provider_name: langgenius/google/google
      provider_type: builtin
      tool_label: GoogleSearch
      tool_name: google_search
      tool_parameters:
        query: ''
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    reranking_enable: false
    retrieval_model: multiple
    top_k: 4
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    allowed_file_extensions:
    - .JPG
    - .JPEG
    - .PNG
    - .GIF
    - .WEBP
    - .SVG
    - .MP4
    - .MOV
    - .MPEG
    - .MPGA
    allowed_file_types: []
    allowed_file_upload_methods:
    - remote_url
    - local_file
    enabled: false
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
    number_limits: 3
  model:
    completion_params:
      stop: []
    mode: chat
    name: gpt-4o-mini
    provider: langgenius/openai/openai
  more_like_this:
    enabled: false
  opening_statement: 本日のご予定を教えてください。
  pre_prompt: 'ユーザーの一日が最高になるようにアシスタントとして役立つ情報を提供します。


    #Step1

    - ユーザーの入力から本日の行先{{destination}}と目的{{purpose}}を抽出してください。


    #Step2

    - google_search を使って"今日の{{destination}}の天気"について検索してください。

    - google_search を使って"今日の{{destination}}の交通情報"について検索してください。

    - google_news_api を使って{{purpose}}や{{destination}}に関連する"最新のニュース"を検索してください。


    #Step3

    Step2 で得られた情報から"今日の運勢"を占ってください。

    - 今日の運勢

    - 今日の落とし穴

    - 今日のラッキーアイテム


    #Step4

    - Step2 とStep3 の結果を以下の順番でユーザーに表示してください。

    - "今日の{{destination}}の天気"

    - "今日の{{destination}}の交通情報"

    - "最新のニュース"

    - "今日の運勢"

    - "今日の落とし穴"

    - "今日のラッキーアイテム"


    最後にユーザーが今日1日頑張れるような励ましのへメッセージを出力してください。'
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: true
  suggested_questions:
  - あなたは何をしてくれるの？
  - 何を伝えたらいいの？
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form: []
version: 0.1.5
