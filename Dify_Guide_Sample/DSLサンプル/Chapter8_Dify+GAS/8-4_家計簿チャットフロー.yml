          text: 'このタスクでは、入力された内容を分析し、以下のカテゴリのいずれかに分類して情報を抽出します。


            【カテゴリ一覧】

            ・食費：食材、外食、飲料、お菓子など

            ・日用品：衛生用品、掃除用品、消耗品など

            ・交通費：ガソリン代、電車、バス、駐車場など

            ・光熱費：電気、ガス、水道など

            ・娯楽・趣味：映画、音楽、本、スポーツなど


            以下の情報を抽出し、指定された形式で出力してください：

            1. 上記カテゴリから最適なもの

            2. 人物（夫/妻）

            3. 品名

            4. 金額（数値のみ）

            5. 詳細情報


            出力形式：

            カテゴリ: [カテゴリ名]

            人物: [夫/妻]

            品名: [品名]

            金額: [金額]

            詳細: [詳細]


            例：

            入力：「夫が駅の売店で500円の雑誌を買った」

            出力：

            カテゴリ: 娯楽・趣味

            人物: 夫

            品名: 雑誌

            金額: 500

            詳細: 駅の売店で購入


            入力：「妻がスーパーでトイレットペーパーを1200円分買った」

            出力：

            カテゴリ: 日用品

            人物: 妻

            品名: トイレットペーパー

            金額: 1200

            詳細: スーパーで購入'
