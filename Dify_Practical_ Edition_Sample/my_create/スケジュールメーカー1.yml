          role: system
          text: '#役割

            現在の時刻は{{#1788590514396.text#}}です。

            {{#1788589597085.start#}}の情報から開始時間、

            {{#1788589597085.end#}}の情報から終了時間を推論して、ISO8601形式(YYYY-MM-DDTHH:MM:SS+09:00)に変換します。

             


            {{#1788589597085.description#}}、{{#1788898655515.text#}}を参照してイベントの概要を詳しくまとめてください。

             

            #出力形式

            以下を格納したJSONを作成してください。

            start:開始時刻（YYYY-MM-DDTHH:MM:SS+09:00）

            end:終了時間（YYYY-MM-DDTHH:MM:SS+09:00）

            range:開始から終了までの時間（YYYY年MM月DD日HH時MM分－DD日HH時MM分）

            description:イベントの概要'
