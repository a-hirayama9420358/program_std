        prompt_template:
        - edition_type: jinja2
          id: baff53b8-dd66-4d81-b77c-f6792942ceaa
          jinja2_text: "1. まず、{{title}}に関する記事を作成する目的と、読者にとっての価値を考えてください。その思考過程を簡潔に記述してください。その際に以下の情報源を参考にしてください\n\
            \n{{ output }}\n\n2. 次に、この目的を達成し、読者に価値を提供するために最適な記事構成について検討してください。以下の点を考慮し、その思考過程を記述してください：\n\
            \   - タイトルの主題をどのように展開するか\n   - キーワードをどのように効果的に組み込むか\n   - 読者の興味をどのように維持するか\n\
            \   - 情報をどのような順序で提示すると最も効果的か\n\n3. 上記の思考プロセスに基づいて、{{title}}に最適なアウトラインを作成してください。アウトライン作成時は以下の点に注意してください：\n\
            \   - SEO最適化のため、適切な見出し階層（H1, H2, H3など）を使用すること\n   - 各セクションは論理的につながり、スムーズな流れを作ること\n\
            \   - 読者の関心を維持するため、適切な見出しと小見出しを使用すること\n   - {{target_word_count}}字を目安に最大10000文字までで、各セクションのバランスを考慮すること\n\
            \   - セクションの数は、指定された文字数を元に現実的なセクション数にすること\n   - 参考情報から得られた独自の視点や最新情報を積極的に取り入れること\n\
            \   - タイトルに従った内容にフォーカスし、論理的に構成を組み立て、重要な内容をなるべく前に持ってくるように書く\n\n4. アウトラインを作成したら、それが{{title}}に対して最適であるか再度確認し、必要に応じて微調整を行ってください。特に、参考情報から得られた洞察が効果的に組み込まれているか確認してください。\n\
            \n5. 最後に、画像の挿入計画を立ててください：\n   - 2000文字ごと、かつセクションの区切りのタイミングで各1枚の画像をUnsplashから取得し表示する位置を指定してください。\n\
            \   - 各セクションに少なくとも1つの画像プランを含めてください。ただし、そのセクションに画像が不要だと判断した場合は、その理由を明記してください。\n\
            \   - 各画像について、そのセクションの内容に関連する適切なキーワードと、簡潔な説明文（alt text）を提案してください。\n  \
            \ - 画像が不要な場合は、\"画像不要\"と明記し、その理由を簡単に説明してください。\n\n出力形式：\n1. 目的と価値の考察\n2.\
            \ 最適な記事構成の検討プロセス\n3. 詳細なアウトライン（番号付きリストと箇条書きを使用し、階層構造を明確に示す）\n4. 画像挿入計画（各セクションに1つ以上のプランを含む。不要な場合はその旨を明記）\n\
            \n各主要セクションには、予想される内容の簡単な説明を追加してください。"
          role: system
          text: "次の情報を基に、{{#1720323205845.title#}}についての詳細な記事アウトラインを作成してください：\n\n\n\
            \  タイトル: {{#1720323205845.title#}}\n\n  キーワード: {{#1720323205845.keywords#}}\n\
            \n  目標文字数: {{#1720323205845.target_word_count#}}\n\n  記事タイプ: [ハウツー/比較/トレンド分析など]\n\
            \n  アウトラインは以下の構造に従って作成してください：\n\n  1. はじめに（導入）\n     - 記事の目的と読者が得られる価値を明確に述べる\n\
            \     - 主要キーワード{{#1720323205845.keywords#}}を自然に組み込む\n\n\n  2. 背景情報\n \
            \    - トピックの重要性や現状の課題を説明\n     - 関連する統計や事実を含める\n\n  3. 主要セクション（3つ）\n \
            \    - 各セクションは具体的なサブトピックを扱う\n     - サブセクションを使用して情報を整理する\n     - 各セクションで{{#1720323205845.keywords#}}のうち1つ以上を使用\n\
            \n\n  4. 実践的なアドバイスまたは分析\n     - 読者が直接活用できる情報や洞察を提供\n     - 具体例や事例研究を含める\n\
            \n  5. まとめ\n     - 主要ポイントを簡潔に要約\n     - 読者に次のアクションを促す\n\n  参考情報：\n  {{#1720338028001.text#}}\n\
            \n\n  注意事項：\n  - 各セクションは論理的につながり、スムーズな流れを作ること\n  - 読者の関心を維持するため、適切な見出しと小見出しを使用すること\n\
            \  - {{#1720323205845.target_word_count#}}字を目安に、各セクションのバランスを考慮すること"
