            \n  アウトラインを以下の形式のXMLに変換してください：\n\n  <structured_outline>\n    <section\
            \ id=\"introduction\">\n      <title>はじめに</title>\n      <content>\n \
            \       <item>記事の目的</item>\n        <item>読者が得られる価値</item>\n      </content>\n\
            \      <image>\n        <position>セクションの末尾</position>\n        <keyword>記事の目的と価値</keyword>\n\
            \        <alt>記事の目的と読者の価値を表現した画像</alt>\n        <description>記事のテーマを視覚的に表現し、読者の興味を引く画像を選択してください。</description>\n\
