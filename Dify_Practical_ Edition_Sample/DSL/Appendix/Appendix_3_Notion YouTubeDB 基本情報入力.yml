          \   - page_id: ページ ID（文字列）\n    を返す。\n    \"\"\"\n    data = json.loads(body)\n\
          \n    # ① 検索結果が空なら例外化 or デフォルト値で終了\n    if not data.get(\"results\"):\n\
          \        # “動画ID が DB に存在しない”という上位フロー判定に任せるなら\n        raise ValueError(\"\
          該当ページが見つかりませんでした\")\n        # もしくは:\n        # return {\"output\": 0, \"\
          page_id\": None}\n\n    page = data[\"results\"][0]\n    page_id = page[\"\
          id\"]\n\n    # ② チェックボックスの値を安全に取得\n    props = page[\"properties\"]\n  \
          \  checkbox_val = (\n        props.get(\"基本情報入力\", {}).get(\"checkbox\"\
          , False)\n        if \"基本情報入力\" in props else False\n    )\n\n    # ③ IF/ELSE\
          \ ノードが `1/0` 判定なので数値に変換\n    output_flag = 1 if checkbox_val else 0\n\n\
          \    return {\n        \"output\": output_flag,\n        \"page_id\": page_id,\n\
          \    }"
