app:
  description: 'YouTube動画の基本情報（タイトル、URL）を自動でNotionデータベースに登録するワークフローアプリです。

    重複チェック機能付きで、すでに登録済みの動画はスキップします。

    処理結果はDiscordに通知されるため、チームでの情報共有もスムーズです。


    【使い方】

    動画IDを入力するだけで、YouTube APIから情報を取得し、Notionに自動登録します。


    【主な機能】

    - YouTube動画情報の自動取得

    - Notionデータベースへの自動登録

    - 重複登録の防止

    - Discord通知（成功/エラー/重複）

    - エラー時の詳細ログ


    【必要な設定】

    ■ Notionデータベースのプロパティ

    - 動画ID（URL型）

    - タイトル（タイトル型）

    - URL（URL型）

    - 基本情報入力（チェックボックス型）

    - page_id（テキスト型）


    ■ 環境変数（シークレット）

    - NOTION_DB_ID：NotionデータベースのID

    - NOTION_API_TOKEN：Notion APIトークン

    - YOUTUBE_API_KEY：YouTube Data API v3のAPIキー

    - DISCORD_WEBHOOK_URL：Discord通知用のWebhook URL


    ---

    input: 動画ID（例：c2uAtx-hwm8）

    output: None（処理結果はDiscordに通知）

    ---'
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: Notion YouTubeDB 基本情報入力
  use_icon_as_answer_icon: false
