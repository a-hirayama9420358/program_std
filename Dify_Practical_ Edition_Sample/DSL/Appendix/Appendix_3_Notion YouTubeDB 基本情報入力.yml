    - data:
        code: "import json, textwrap\n\n\ndef main(\n    notion_query_err: str | None=None,\n\
          \    parse_err: str | None=None,\n    youtube_api_err: str | None=None,\n\
          \    prop_err: str | None=None,\n    notion_update_err: str | None=None,\n\
          ) -> dict:\n    \"\"\"\n    受け取った 5変数 すべてを走査し、\n    値があれば「[変数名] エラー内容」でまとめる。\n\
          \    \"\"\"\n    messages = []    \n    for label, msg in [\n        (\"\
          Notion Query\", notion_query_err),\n        (\"Parse Notion\", parse_err),\n\
          \        (\"YouTube API\", youtube_api_err),\n        (\"Property Parse\"\
          , prop_err),\n        (\"Notion Update\", notion_update_err),\n    ]:\n\
          \        if msg:\n            messages.append(f\"[{label}] {msg}\")\n\n\
          \    raw_text = \"\\n\\n\".join(messages) or \"(no error text)\"\n\n   \
          \ # Discord Webhook 2000 文字制限対策\n    short_text = textwrap.shorten(raw_text,\
          \ width=1500,\n                                  placeholder=\" ...[truncated]\"\
          )\n    return {\n        \"safe_json\": json.dumps({\"content\": short_text},\
          \ ensure_ascii=False)\n    }\n"
