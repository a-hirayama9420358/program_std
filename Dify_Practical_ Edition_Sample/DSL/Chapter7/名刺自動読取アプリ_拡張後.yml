              【処理手順】

              1. 「Notion: Create Database Item」を使用して基本的な名刺情報をデータベースに登録

              2. 「Notion: Add Content to Page」を使用して、作成されたアイテムのページに企業調査結果を追加

              3. 登録内容のうち記載がない場合は空欄で登録

               

